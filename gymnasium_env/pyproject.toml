[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gymnasium_env"]

[project]
name = "gymnasium_env"
version = "0.0.1"
dependencies = [
  "gymnasium",
  "pygame>=2.1.3",
  "pre-commit",
]

description = "Blokus AI Agents Environment for Gymnasium"  # Add a description
authors = [
    { name = "Mario Pariona", email = "mariopariona117@gmail.com" },  # Replace with your info
]
license = "MIT"  # Specify a license
readme = "README.md"  # Specify your README file if available

[tool.hatch.metadata]
homepage = "https://github.com/yourusername/blokus_env"  # Update with your project URL
repository = "https://github.com/yourusername/blokus_env"  # Update with your project URL
